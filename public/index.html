<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101827; color: #eff6ff; }
    main { max-width: 900px; margin: auto; padding: 40px 24px; }
    p { line-height: 1.7; }
    .notice { padding: 18px; border: 1px solid #8396ac; border-radius: 12px; }
    a { color: #93c5fd; }
    ul { list-style: none; padding: 0; display: grid; gap: 16px; }
    li { padding: 20px; border: 1px solid #506079; border-radius: 12px; }
    h2 { font-size: 20px; margin-top: 0; }
    li p { margin-bottom: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <p>BYTE BACK · 2단계 자료 분리</p>
    <h1>가상 자료실</h1>
    <p class="notice">모두 실습용 가상 자료입니다. 화면은 서버 API를 통해 데이터베이스의 자료를 읽습니다. 아직 로그인하지 않은 방문자도 공개 API에서 자료를 읽을 수 있습니다. 로그인 보호는 다음 단계에서 붙입니다. 최신 정적 파일에서 자료를 제거했어도 옛 공개 커밋과 옛 배포 이력에 남은 자료는 지워지지 않았습니다. 과거 노출은 해소되지 않았습니다.</p>
    <p><a href="/database.json">DB 직접 접근 검증 정보</a> · <a href="https://github.com/suminkim8203/choi-bujang-secret-vault#readme">구현·검증 기록</a></p>
    <p id="status" role="status">가상 자료를 불러오는 중입니다.</p>
    <ul id="notes" aria-label="가상 자료 목록"></ul>
  </main>
  <script type="module">
    const list = document.querySelector('#notes');
    const status = document.querySelector('#status');
    try {
      const response = await fetch('/api/notes', { method: 'GET', cache: 'no-store' });
      if (!response.ok) throw new Error('READ_FAILED');
      const data = await response.json();
      if (!Array.isArray(data.notes) || data.notes.some(note => !note
          || typeof note.title !== 'string' || typeof note.content !== 'string')) {
        throw new Error('FORMAT_INVALID');
      }
      for (const note of data.notes) {
        const card = document.createElement('li');
        const title = document.createElement('h2');
        const body = document.createElement('p');
        title.textContent = note.title;
        body.textContent = note.content;
        card.append(title, body);
        list.append(card);
      }
      status.textContent = `데이터베이스에서 가상 자료 ${data.notes.length}건을 불러왔습니다.`;
    } catch {
      status.textContent = '자료를 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.';
    }
  </script>
</body>
</html>
